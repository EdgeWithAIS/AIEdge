name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Tests and eval quality gate (offline, synthetic fixtures)
        run: python -m pytest -q
      - name: Offline eval report
        run: python evals/run_evals.py --offline >> "$GITHUB_STEP_SUMMARY"
